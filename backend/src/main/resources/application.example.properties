# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Spring AI - Ollama
# ===============================
spring.ai.ollama.base-url=http://localhost:11434

# AI Chat Model
spring.ai.ollama.chat.options.model=qwen2.5-coder:3b
spring.ai.ollama.chat.options.temperature=0.2

# Embedding Model
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ===============================
# GitHub OAuth2
# ===============================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===============================
# Application URLs
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===============================
# GitHub Token Encryption
# ===============================
app.token-encryptor-password=${DEVPILOT_ENCRYPTION_PASSWORD}
app.token-encryptor-salt=${DEVPILOT_ENCRYPTION_SALT}

# ===============================
# Code Indexing
# ===============================
app.github.api-delay-ms=50
app.indexing.chunk-size=800
app.indexing.max-file-bytes=102400

# ===============================
# Spring AI - PGVector
# ===============================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=120s
